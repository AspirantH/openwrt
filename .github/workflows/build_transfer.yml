name: build & transfer

on:
#  schedule:
#    - cron: '0 */8 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [packages-updated]

env:
  REPO_TOKEN: ${{ secrets.TOKEN_OPENWRT }}
  WPUSH: ${{ secrets.WPUSH }}
  TZ: Asia/Shanghai

jobs:
  check:
    runs-on: ubuntu-latest
    name: Check upstream updates
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Restore commit cache
        id: restore-commit-cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .commit-cache
          key: commit-cache-main-${{ github.run_id }}
          restore-keys: |
            commit-cache-main-

      - name: Check openwrt-packages commits
        id: check
        run: |
          latest_sha=$(curl -s -H "Authorization: token ${{ secrets.TOKEN_OPENWRT }}" \
            https://api.github.com/repos/AspirantH/openwrt-packages/commits?per_page=1 | \
            jq -r '.[0].sha')

          if [ -z "$latest_sha" ] || [ "$latest_sha" == "null" ]; then
            echo "Failed to fetch latest SHA, forcing build."
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          cached_sha=""
          if [ -f .commit-cache/last_commit.txt ]; then
            cached_sha=$(cat .commit-cache/last_commit.txt)
          fi
          echo "latest_sha=$latest_sha"
          echo "cached_sha=$cached_sha"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] || [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "Manual/external trigger: forcing build and updating cache."
            mkdir -p .commit-cache
            echo "$latest_sha" > .commit-cache/last_commit.txt
            echo "should_build=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$latest_sha" == "$cached_sha" ]; then
            echo "No new commit, skipping build."
            echo "should_build=false" >> $GITHUB_OUTPUT
          else
            echo "New commit detected: $latest_sha (cached: $cached_sha)"
            mkdir -p .commit-cache
            echo "$latest_sha" > .commit-cache/last_commit.txt
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

      - name: Save commit cache
        if: steps.check.outputs.should_build == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .commit-cache
          key: commit-cache-main-${{ github.run_id }}

  build:
    needs: check
    if: needs.check.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    name: Build ${{matrix.target}}
    strategy:
      fail-fast: false
      matrix:
        target: ["${{ github.event.client_payload.target || 'x86_64' }}"]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          fetch-depth: 0

      - name: Load Settings.ini
        run: |
          echo ${{matrix.target}}
          source "${{ github.workspace }}/devices/common/settings.ini"
          if [ -f "devices/${{matrix.target}}/settings.ini" ]; then
            source "${{ github.workspace }}/devices/${{matrix.target}}/settings.ini"
          fi
          echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
          echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV
          echo "CONFIG_FILE=${CONFIG_FILE}" >> $GITHUB_ENV
          echo "DIY_SH=${DIY_SH}" >> $GITHUB_ENV
          echo "FREE_UP_DISK=${FREE_UP_DISK}" >> $GITHUB_ENV
          echo "UPLOAD_BIN_DIR_FOR_ARTIFACT=${UPLOAD_BIN_DIR_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_ARTIFACT=${UPLOAD_FIRMWARE_FOR_ARTIFACT}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_FOR_RELEASE=${UPLOAD_FIRMWARE_FOR_RELEASE}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_TO_COWTRANSFER=${UPLOAD_FIRMWARE_TO_COWTRANSFER}" >> $GITHUB_ENV
          echo "UPLOAD_FIRMWARE_TO_WETRANSFER=${UPLOAD_FIRMWARE_TO_WETRANSFER}" >> $GITHUB_ENV
          sed -i "1a REPO_TOKEN=${{ secrets.TOKEN_OPENWRT }}" ${{ github.workspace }}/devices/common/diy.sh
          sed -i "1a TARGET=${{matrix.target}}" ${{ github.workspace }}/devices/common/diy.sh

      - name: Free disk space
        uses: coder-xiaomo/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install build-essential clang flex bison g++ gawk \
          gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
          python3-setuptools rsync swig unzip zlib1g-dev file wget \
          llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
          libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev
          sudo -E apt-get -qq autoremove --purge
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "Asia/Shanghai"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%m/%d_%Y_%H/%M')" >> $GITHUB_ENV
          echo "date2=$(date +'%m/%d %Y')" >> $GITHUB_ENV
          VERSION="$(echo "${{github.event.action}}" | grep -Eo " [0-9.]+" | sed -e 's/ //')" || true
          [ "$VERSION" ] && echo "VERSION=$VERSION" >> $GITHUB_ENV || echo "VERSION=$(date +'%m.%d')" >> $GITHUB_ENV

      - name: Clone source code
        run: |
          set -x
          TAG_INFO="$(curl -gs -H 'Content-Type: application/json' \
             -H "Authorization: Bearer ${{ secrets.TOKEN_OPENWRT }}" \
             -X POST -d '{ "query": "query {repository(owner: \"openwrt\", name: \"openwrt\") {refs(refPrefix: \"refs/tags/\", first: 4, orderBy: {field: TAG_COMMIT_DATE, direction: DESC}) {nodes {name target { ... on Tag {tagger {date}}}}}}}"}' https://api.github.com/graphql)"
          TAG_DATE="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[] | select(.name | startswith("v25")) | .target.tagger.date' | head -n 1)"
          if [[ $(( ($(date +%s) - $(date -d "$TAG_DATE" +%s)) / 86400 )) -lt 10 || "${{ contains(github.event.action, 'tags') }}" == "true" ]]; then
          REPO_BRANCH="$( echo ${TAG_INFO} | jq -r '.data.repository.refs.nodes[].name' | grep v25 | head -n 1)"
          #REPO_BRANCH="openwrt-25.12"
          else
          REPO_BRANCH="openwrt-25.12"
          fi

          if [[ ! "${{ env.REPO_BRANCH }}" && "$REPO_URL" == "https://github.com/openwrt/openwrt" ]]; then
              git clone $REPO_URL -b $REPO_BRANCH openwrt
          elif [[ ! "${{ env.REPO_BRANCH }}" ]]; then
              git clone $REPO_URL openwrt
          else
              REPO_BRANCH="${{env.REPO_BRANCH}}"
              if [[ ${#REPO_BRANCH} -lt 10 ]]; then
                  git clone $REPO_URL -b ${REPO_BRANCH} openwrt
              else
                  git clone $REPO_URL openwrt
                  cd openwrt
                  git checkout ${REPO_BRANCH}
              fi
          fi

      - name: Load custom configuration
        run: |
          function git_clone_path() {
            trap 'rm -rf "$tmpdir"' EXIT
            branch="$1" rurl="$2" mv="$3"
            [[ "$mv" != "mv" ]] && shift 2 || shift 3
            rootdir="$PWD"
            tmpdir="$(mktemp -d)" || exit 1
            if [ ${#branch} -lt 10 ]; then
            git clone -b "$branch" --depth 1 --filter=blob:none --sparse "$rurl" "$tmpdir"
            cd "$tmpdir"
            else
            git clone --filter=blob:none --sparse "$rurl" "$tmpdir"
            cd "$tmpdir"
            git checkout $branch
            fi
            if [ "$?" != 0 ]; then
              echo "error on $rurl"
              exit 1
            fi
            git sparse-checkout init --cone
            git sparse-checkout set $@
            [[ "$mv" != "mv" ]] && cp -rn ./* $rootdir/ || mv -n $@/* $rootdir/$@/
            cd $rootdir
            }
          export -f git_clone_path
          mkdir -p openwrt
          cp -rf devices/common/. openwrt/
          cp -rf devices/${{matrix.target}}/. openwrt/
          cp -rf devices openwrt/
          cd openwrt
          chmod +x devices/common/$DIY_SH
          export DB_PASS="${{ secrets.DB_PASSWORD }}"
          /bin/bash "devices/common/$DIY_SH"
          cp -f devices/common/$CONFIG_FILE .config
          if [ -f "devices/${{matrix.target}}/$CONFIG_FILE" ]; then
            echo >> .config
            cat devices/${{matrix.target}}/$CONFIG_FILE >> .config
          fi
          if [ -f "devices/${{matrix.target}}/$DIY_SH" ]; then
            chmod +x devices/${{matrix.target}}/$DIY_SH
            echo "/bin/bash devices/${{matrix.target}}/$DIY_SH"
            /bin/bash "devices/${{matrix.target}}/$DIY_SH"
          fi
          cp -Rf ./diy/* ./ || true

      - name: Defconfig
        run: |
          cd openwrt
          make defconfig
          if [[ ! "${{matrix.target}}" =~ (amlogic_meson8b|armsr_armv8|bcm27xx_*|rockchip_armv8|sunxi_*|x86_*|siflower_*) ]]; then
          sed -n '/# Wireless Drivers/,/# end of Wireless Drivers/p' .config | sed -e 's/=m/=n/' >>.config
          sed -i "s/\(kmod-qca.*\)=m/\1=n/" .config
          make defconfig
          fi
          cat .config

      - name: Cache
        uses: stupidloud/cachewrtbuild@main
        with:
          ccache: 'false'
          mixkey: ${{ matrix.target }}
          clean: ${{ contains(github.event.inputs.param, 'nocache') }}
          prefix: ${{ github.workspace }}/openwrt

      - name: Apply custom files
        run: |
          cd openwrt
          mkdir -p files
          cp -rf ../devices/common/diy/package/base-files/files/* files/

      - name: Compile the firmware
        id: compile
        run: |
          shopt -s extglob
          df -hT
          cd openwrt
          sed -i '/define prepare_rootfs/a \	find $(1) -name "*-opkg" -delete' include/rootfs.mk
          echo -e "$(($(nproc)+1)) thread compile"
          make -j$(($(nproc)+1)) || { log=$(mktemp); make V=s &>$log; cat $log; exit 1; }
          #make -j1 V=s
          rm -rf staging_dir/toolchain-*/bin/*openwrt-linux-musl-lto-dump
          rm -rf staging_dir/toolchain-*/initial
          df -hT

      - name: Organize files
        id: organize
        continue-on-error: true
        run: |
          shopt -s extglob
          cd openwrt/bin/targets/*/*/
          cp $GITHUB_WORKSPACE/openwrt/.config ${{matrix.target}}.config || true
          cp $GITHUB_WORKSPACE/openwrt/build_dir/target-*/linux-*/linux-*/.config ${{matrix.target}}_kernel.config || true
          Emoji=("🎉" "🤞" "✨" "🎁" "🎈" "🎄" "🎨" "💋" "🍓" "🍕" "🍉" "💐" "🌴" "🚀" "🛸" "🗽" "⛅" "🌈" "🔥" "⛄" "🐶" "🏅" "🦄" "🐤")
          EMOJI=$(printf "%s\n" "${Emoji[@]}" | shuf -n 1)
          echo "EMOJI=${EMOJI}" >> $GITHUB_ENV
          firmware_file=$(find . -name "*-squashfs-combined-efi.img.gz" | head -n1)
          build_date=$(date +%Y%m%d)
          release_name="${EMOJI}${build_date}-openwrt-x86-64-generic-squashfs-combined-efi.img.gz"
          cp "$firmware_file" "$release_name"
          echo "RELEASE_FILE=$(pwd)/$release_name" >> $GITHUB_ENV

      - name: Create release
        id: create-release
        if: env.RELEASE_FILE != ''
        uses: softprops/action-gh-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_OPENWRT }}
        with:
          files: "${{ env.RELEASE_FILE }}"
          name: "${{ env.date2 }} ${{matrix.target}} ${{ env.EMOJI }}"
          tag_name: "${{ env.date }}_${{matrix.target}}"
          body: "OpenWrt firmware compiled from ${{ github.repository }}"
          draft: false
          prerelease: false
          generate_release_notes: false

      - name: Upload firmware to WebDAV
        id: upload-webdav
        if: env.RELEASE_FILE != ''
        continue-on-error: true
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_URL }}
          WEBDAV_USER: ${{ secrets.WEBDAV_USER }}
          WEBDAV_PASS: ${{ secrets.WEBDAV_PASS }}
          WEBDAV_PATH: ${{ secrets.WEBDAV_PATH }}
        run: |
          curl -X MKCOL -u "${WEBDAV_USER}:${WEBDAV_PASS}" "${WEBDAV_URL}${WEBDAV_PATH}/" || true
          curl -T "$RELEASE_FILE" -u "${WEBDAV_USER}:${WEBDAV_PASS}" "${WEBDAV_URL}${WEBDAV_PATH}/$(basename "$RELEASE_FILE")"

      - name: Clean
        if: steps.upload-webdav.outcome == 'success' && env.RELEASE_FILE != ''
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_OPENWRT }}
        run: |
          TAG_NAME="${{ env.date }}_${{matrix.target}}"
          echo "Deleting release ${TAG_NAME} (WebDAV succeeded) ..."
          gh release delete "${TAG_NAME}" -y --cleanup-tag --repo "${{ github.repository }}"

      - name: WPush NOTICE
        continue-on-error: true
        if: env.WPUSH
        run: |
          if [[ "${{ steps.compile.outcome }}" == "success" ]]; then
            if [[ -n "${{ env.RELEASE_FILE }}" ]]; then
              FILENAME=$(basename "${{ env.RELEASE_FILE }}")
              FILESIZE=$(du -h "${{ env.RELEASE_FILE }}" | cut -f1)
              if [[ "${{ steps.upload-webdav.outcome }}" == "success" ]]; then
                UPLOAD_STATUS="✅ WebDAV 上传成功"
                DOWNLOAD_LINK="${{ secrets.WEBDAV_URL }}${{ secrets.WEBDAV_PATH }}/${FILENAME}"
              else
                UPLOAD_STATUS="❌ WebDAV 上传失败（已保留 GitHub Release）"
                DOWNLOAD_LINK="${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ env.date }}_${{ matrix.target }}"
              fi
            else
              FILENAME="未生成固件文件"
              FILESIZE="N/A"
              UPLOAD_STATUS="⚠️ 无固件文件"
              DOWNLOAD_LINK="请查看 Actions 日志"
            fi

            cd openwrt
            PLUGINS=$(grep -E '^CONFIG_PACKAGE_(luci-app-|luci-theme-|zerotier|aria2|openlist)=' .config \
                      | grep '=y' | sed 's/CONFIG_PACKAGE_//;s/=y//' | head -n 10)
            if [[ -n "$PLUGINS" ]]; then
              PLUGIN_LIST=$(echo "$PLUGINS" | sed 's/^/- `/; s/$/`/')
            else
              PLUGIN_LIST="> （未提取到插件列表）"
            fi

            MSG=$(printf '%s\n' \
              "## 🎉 OpenWrt 固件编译完成" \
              "" \
              "| 项目 | 信息 |" \
              "| --- | --- |" \
              "| **设备** | ${{ matrix.target }} |" \
              "| **编译日期** | ${{ env.date2 }} |" \
              "| **固件文件** | \`${FILENAME}\` |" \
              "| **文件大小** | ${FILESIZE} |" \
              "| **上传状态** | ${UPLOAD_STATUS} |" \
              "| **下载地址** | ${DOWNLOAD_LINK} |" \
              "" \
              "#### 主要插件" \
              "${PLUGIN_LIST}" \
              "" \
              "> 如需完整插件列表，请查看 \`.config\` 文件。")

            TITLE="✅ OpenWrt 编译成功"
          else
            MSG=$(printf '%s\n' \
              "## ❌ OpenWrt 编译失败" \
              "" \
              "- **设备**：${{ matrix.target }}" \
              "- **时间**：${{ env.date2 }}" \
              "- **日志**：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")
            TITLE="❌ OpenWrt 编译失败"
          fi

          curl -X POST 'https://api.wpush.cn/api/v1/send' \
            --data-urlencode "apikey=${{ secrets.WPUSH }}" \
            --data-urlencode "title=${TITLE}" \
            --data-urlencode "content=${MSG}"

      - name: Delete workflow runs
        uses: GitRML/delete-workflow-runs@main
        continue-on-error: true
        with:
          token: ${{ secrets.TOKEN_OPENWRT }}
          retain_days: 1
          keep_minimum_runs: 1
