name: Repo Dispatcher

on: 
  workflow_dispatch:
    inputs:
      param:
        description: 'parameter'
        required: false
        default: ''

env:
  TOKEN_OPENWRT: ${{ secrets.TOKEN_OPENWRT }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64]
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: cancel running workflows
      uses: styfle/cancel-workflow-action@main
      if: contains(github.event.inputs.param, 'cw')
      with:
        workflow_id: all
        access_token: ${{ secrets.TOKEN_OPENWRT }}

    - name: Load Settings.ini
      run: |
        source "${GITHUB_WORKSPACE}/devices/common/settings.ini"
        if [ -f "devices/${{ matrix.target }}/settings.ini" ]; then
          source "${GITHUB_WORKSPACE}/devices/${{ matrix.target }}/settings.ini"
        fi
        echo "REPO_URL=${REPO_URL}" >> $GITHUB_ENV
        echo "REPO_BRANCH=${REPO_BRANCH}" >> $GITHUB_ENV

    - name: Trigger Packages Update
      continue-on-error: true
      run: |
        gitdate=$(curl -H "Authorization: token ${{ secrets.TOKEN_OPENWRT }}" -s "https://api.github.com/repos/learnscode/openwrt-packages/actions/runs" | jq -r '.workflow_runs[0].created_at')
        gitdate=$(date -d "$gitdate" +%s)
        now=$(date -d "$(date)" +%s)
        if [[ $(expr $gitdate + 120) < $now ]]; then
          curl -X POST https://api.github.com/repos/learnscode/openwrt-packages/dispatches \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.TOKEN_OPENWRT }}" \
          --data '{"event_type": "update"}'
        fi

    - name: Trigger Compile
      run: |
        sudo timedatectl set-timezone "$TZ"
        curl -X POST https://api.github.com/repos/${{ github.repository }}/dispatches \
          -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.TOKEN_OPENWRT }}" \
          -d "{\"event_type\": \"${{ matrix.target }} ${{ github.event.inputs.param }}\", \"client_payload\": {\"target\": \"${{ matrix.target }}\"}}"
